<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-wrp">
      <div class="main-title">Weather App</div>
      <div class="search">
        <input type="text" placeholder="Search" class="searchInput" />
        <button class="searchButton">
          <img src="images/search.png" class="search-img" />
        </button>
      </div>
      <div class="error">Invalid City</div>
      <div class="weather">
        <img src="images/rain.png" class="weather-icon" />

        <h1 class="temp">22 °c</h1>
        <h2 class="city">Mangalore</h2>
        <div class="details">
          <div class="col1">
            <img src="images/humidity.png" class="humidity-img" />
            <p class="humidity">20%</p>
            <p>Humidity</p>
          </div>

          <div class="col2">
            <img src="images/wind.png" class="wind-img" />
            <p class="windspeed">20km/h</p>
            <p>Wind Speed</p>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
